name: CI

# Backend tests run against a real PostgreSQL (the app requires one) and the
# frontend build runs TypeScript + Vite. Both must pass before a push counts.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: jobs only need to read the repository. This limits the
# blast radius of the default GITHUB_TOKEN (no package/container writes).
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vbase
          POSTGRES_PASSWORD: vbase_dev_pw
          POSTGRES_DB: vbase_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U vbase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      VBASE_TEST_DATABASE_URL: postgresql+asyncpg://vbase:vbase_dev_pw@127.0.0.1:5433/vbase_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend + test dependencies
        run: pip install -e backend[dev]

      - name: Assert PostgreSQL is reachable
        # The suite skips (silently greening) without a database. Fail loudly
        # if the service container is not up.
        run: python -c "import socket; s = socket.create_connection(('127.0.0.1', 5433), timeout=5)"

      - name: Run test suite (applies Alembic migrations itself)
        run: python -m pytest tests -q
        # tests/backend/conftest.py points DATABASE_URL at the service container
        # and applies the project's own Alembic migrations before the tests.

  frontend:
    name: Frontend build (TypeScript + Vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          # the lockfile pins a wrangler version that requires Node >= 22
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: apps/web

      - name: Build (tsc -b && vite build)
        run: npm run build
        working-directory: apps/web

      - name: Validate Wrangler config (no upload)
        run: npx wrangler deploy --dry-run
        working-directory: apps/web
