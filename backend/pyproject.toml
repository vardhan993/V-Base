[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vbase-backend"
version = "0.2.0"
description = "V-Base - premium B2B company and professional contact intelligence API (FastAPI + PostgreSQL)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "tenacity>=9.0",
    "python-dateutil>=2.9",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "orjson>=3.10",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
vbase-run = "nexus.commands.run:main"
vbase-migrate = "nexus.commands.migrate:main"
vbase-admin = "nexus.commands.admin:main"
vbase-backup = "nexus.commands.backup:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["../tests/backend", "tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

# Linting is configured once for the whole repository in ../ruff.toml so the
# application and the test suite are checked with identical rules.
