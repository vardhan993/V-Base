# Alembic configuration for V-Base.
#
# The database URL is NOT stored here. It is read at runtime from the
# DATABASE_URL environment variable (see alembic/env.py), so no credentials
# ever land in the repository.

[alembic]
script_location = alembic
# `src` makes the nexus package importable when migrations run from backend/.
prepend_sys_path = . src
version_path_separator = os
# Placeholder only; env.py overwrites it with settings.database_url.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
