<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="V-Base">
  <defs>
    <linearGradient id="vbase-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#0b1220" />
  <!-- Three stacked bars: the "base" of records, rising to the decision maker -->
  <rect x="7" y="19" width="18" height="4" rx="1.25" fill="#6366f1" />
  <rect x="7" y="13" width="12" height="4" rx="1.25" fill="url(#vbase-mark)" />
  <rect x="7" y="7" width="7" height="4" rx="1.25" fill="#a5b4fc" />
  <circle cx="24" cy="24.5" r="1.5" fill="#a5b4fc" opacity="0.85" />
</svg>
